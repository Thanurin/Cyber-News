<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buy.com</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer&display=swap" rel="stylesheet">

    <link rel="icon" href="./img/Cybersecurity in the digital age.png">

    <link rel="stylesheet" href="style4.css">

</head>

<body>
    <div id="complete">
        
        <form id="orderForm">
            <div>
                <p class="text">Facebook Name:</p>
                
                <input class="box" type="text" id="facebookName"placeholder="Cyber News">
                
                <p class="text">Phone Number:</p>
                
                <input class="box" type="text" id="phoneNumber"placeholder="123456789">
                <p class="location" id="Location">
                    Location:
                </p>
                
                <input class="box"type="text"lang="km" id="location" placeholder="ស្រុកចំការលើ ខេត្តកំពង់ចាម">
            </div>
            
            <p id="text">Type of Jammer:</p>
            
            <label>
                <input type="checkbox" value="E32+E01 25$">
                E32+E01 x1 25$
            </label>
            
            <label>
                <input type="checkbox" value="E32+E01(2) 38$">
                E32+E01 x2 38$
            </label>
            
            <label>
                <input type="checkbox" value="E32+E01(3) 50$">
                E32+E01 x3 50$
            </label>
            
            <label>
                <input type="checkbox" value="E32+L01 15$">
                E32+L01 x1 15$
            </label>
            
            <main>
                <label>
                    <input class="last" type="checkbox" value="E32+L01(2) 25$">
                    32+L01 x2 25$
                </label>
                <label>
                    <input class="last" type="checkbox" value="E32+L01(3) 35$">
                    E32+L01 x3 35
                </label>
                
                <label>
                    <input class="last" type="checkbox" value="E32+L01(4) 45$">
                    E32+L01 x4 45$
                </label>
            </main>
            
            <p id="delivery">Delivery By:</p>
            
            <label>
                <input type="checkbox" value="V&T">
                VET (2$)
            </label>
            
            <label>
                <input type="checkbox" value="J&T">
                J&T (2$)
            </label>
            
            <ul>
                <li>
                    QR-Code (Please send it to us with your own facebook account while you paid to us)
                </li>
            </ul>
            
            <img src="./img/IMG_0917.JPG" alt="QR" id="qr">
            <button type="submit" id="send">Send</button>
            <button type="button" id="back">Back</button>
        </form>

    </div>

    <script src="js3.js"></script>

</body>

</html>
